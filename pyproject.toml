[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-coherence"
version = "0.1.0"
description = "Extracción de narrativas con coherencia causal sobre corpus de noticias (Capstone)."
# numba 0.60 (fijado abajo) solo tiene soporte hasta Python 3.12.
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Preprocesamiento + RollingLDA ---
    "spacy",
    "nltk",
    "ttta",
    "pandas",
    # --- Narrative Trails: lo que importan Library/narrative_landscape.py,
    # storyline.py y helper.py del repo externo (ver README) ---
    "networkx",
    "altair",
    "matplotlib",
    "seaborn",
    "pillow",
    # --- Fijados por reproducibilidad, no por compatibilidad ---
    # Con versiones más nuevas todo instala sin conflictos, pero cambia el
    # hash de baseline_narrative.py (referencia 63d0faab065a6f4c).
    # Detalle y evidencia en docs/reproducibilidad.md.
    #
    # Proyección UMAP:
    "scipy==1.13.1",        # inicialización espectral de UMAP (eigsh/lobpcg); con 1.18 cambia la proyección
    "umap-learn==0.5.7",    # la proyección misma
    "pynndescent==0.5.13",  # grafo de vecinos aproximados que construye UMAP
    "numba==0.60.0",        # compila UMAP y pynndescent; fija el techo Python <3.13
    "llvmlite==0.43.0",     # backend que exige numba 0.60
    "numpy==2.0.2",         # numba 0.60 exige numpy<2.1; es la versión de la referencia
    # Agrupamiento en tópicos (cambia aunque la proyección UMAP sea la misma):
    "hdbscan==0.8.40",
    "scikit-learn==1.6.1",  # hdbscan lo usa; se cambió junto con hdbscan, no se sabe cuál de los dos influye
]

[project.optional-dependencies]
# Kernel y ejecutor para los notebooks de Examples/ (scripts/run_notebooks.py)
notebooks = ["ipykernel", "nbclient", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]
